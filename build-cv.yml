name: Regenerate CV website from LaTeX

on:
  push:
    paths:
      - 'Main.tex'          # only triggers when the CV changes
  workflow_dispatch:        # also allows manual trigger from GitHub UI

permissions:
  contents: write           # needed to push the regenerated files

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra

      - name: Compile Main.tex → Alkhawaldeh_CV.pdf
        run: |
          # Run twice so cross-references resolve correctly
          pdflatex -interaction=nonstopmode -jobname=Alkhawaldeh_CV Main.tex
          pdflatex -interaction=nonstopmode -jobname=Alkhawaldeh_CV Main.tex

      - name: Regenerate index.html from Main.tex
        run: python scripts/tex_to_html.py Main.tex index.html

      - name: Commit and push updated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html Alkhawaldeh_CV.pdf
          # Only commit if something actually changed
          git diff --cached --quiet || git commit -m "chore: regenerate site and PDF from Main.tex [skip ci]"
          git push
